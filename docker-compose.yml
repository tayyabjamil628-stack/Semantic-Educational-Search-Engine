# FILE: docker-compose.yml
services:
  semantic_search_db:
    image: pgvector/pgvector:pg16
    container_name: semantic_search_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: semantic_search_api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      semantic_search_db:
        condition: service_healthy

volumes:
  pgdata: